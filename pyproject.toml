[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mecc-frequency"
version = "1.0.0"
description = "Mutual-exclusion control correction for locally private frequency estimation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]

[project.scripts]
mecc = "mecc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
